[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-tetris-clone"
version = "0.1.0"
description = "Guideline-accurate Tetris engine (Jstris-style rules) with a pygame-ce renderer and a headless AI environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The engine package is dependency-free on purpose (AI/headless use).
dependencies = []

[project.optional-dependencies]
game = ["pygame-ce>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
tetris = "tetris.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
